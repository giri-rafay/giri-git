apiVersion: infra.k8smgmt.io/v3
kind: Blueprint
metadata:
  name: golden-bp
  project: giri-nov
spec:
  base:
    name: default-aks
    version: 3.2.0
  componentsCriticality:
  - name: addon-trivy
  - name: network-policy
  - name: cost-profile
  - name: opa-policy
  costProfile:
    name: default-cost-profile-azure
    version: version-1738240875
  customAddons:
  - name: addon-trivy
    version: v1
  - name: custom-alert-manager
    version: v1
  defaultAddons:
    enableIngress: true
    enableMonitoring: true
    monitoring:
      gpuOperator:
        enabled: true
      metricsServer:
        customizationEnabled: true
      prometheusAdapter:
        customizationEnabled: true
  driftWebhook:
    enabled: true
  namespaceConfig:
    enableSync: true
    syncType: Unmanaged
  networkPolicy:
    policies:
    - name: pol1
      version: v1
    profile:
      name: default
      version: latest
  opaPolicy:
    opaPolicy:
    - name: policy-privileged
      version: version-1739175596
    profile:
      name: default
      version: latest
  type: golden
  version: v2
